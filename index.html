<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spelling Trainer</title>

<!-- Bootstrap (opcional, só pra ficar bonito) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 20px;
    width: 350px;
    text-align: center;
}

button {
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">
    <h3>🔤 Spelling Trainer</h3>

    <button class="btn btn-primary" onclick="playSpelling()">🔊 Play</button>

    <input id="input" class="form-control mt-3" placeholder="Type what you hear">

    <button class="btn btn-success" onclick="checkAnswer()">Check</button>

    <p style="background-color: aliceblue;" id="result" class="mt-3"></p>
    <p style="background-color: aliceblue;">Score: <span id="score">0</span></p>
</div>

<script>
let words = Array.from({length: 1000}, (_, i) => i.toString());
let currentWord = "";
let score = 0;

// gerar palavra nova
function newWord() {
    currentWord = words[Math.floor(Math.random() * words.length)];
    document.getElementById("input").value = "";
    document.getElementById("result").innerText = "";
}

function playSpelling() {
    speechSynthesis.cancel();

    let letters = currentWord.split("");
    let delay = 0;

    letters.forEach(letter => {
        let utter = new SpeechSynthesisUtterance(letter);
        utter.lang = "en-US";

        setTimeout(() => {
            speechSynthesis.speak(utter);
        }, delay);

        delay += 600;
    });
}

// verificar resposta
function checkAnswer() {
    let user = document.getElementById("input").value.toLowerCase();

    if (user === currentWord) {
        document.getElementById("result").innerText = "✅ Correct!";
        score++;
    } else {
        document.getElementById("result").innerText = "❌ Wrong! It was: " + currentWord;
        score = Math.max(0, score - 1);
    }

    document.getElementById("score").innerText = score;
    newWord();
}

// iniciar
newWord();
</script>

</body>
</html>
